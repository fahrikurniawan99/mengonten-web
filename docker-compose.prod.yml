services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: https://api-mengonten.tiroe.io
    container_name: mengonten-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
